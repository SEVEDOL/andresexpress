# Configuracion para los tests: no crea tablas ni se conecta a DynamoDB al arrancar.
aws:
  region: us-east-1
  dynamodb:
    endpoint: http://localhost:8000
    create-tables: false

coverage:
  tariffs-table: coverage-tariffs

# Los tests no deben llamar a la API Colombia real al arrancar
api:
  colombia:
    warm-up: false
