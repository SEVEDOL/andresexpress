server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: coverage-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coverage_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

api:
  colombia:
    url: ${API_COLOMBIA_URL:https://api-colombia.com/api/v1/City}
    connect-timeout-ms: ${API_COLOMBIA_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${API_COLOMBIA_READ_TIMEOUT_MS:15000}
    cache-minutes: ${API_COLOMBIA_CACHE_MINUTES:60}
