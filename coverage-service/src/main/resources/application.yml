server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: coverage-service

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    # Local: http://localhost:8000 (DynamoDB Local). En AWS se deja vacio.
    endpoint: ${DYNAMODB_ENDPOINT:}
    create-tables: ${DYNAMODB_CREATE_TABLES:true}

coverage:
  tariffs-table: ${COVERAGE_TARIFFS_TABLE:coverage-tariffs}

api:
  colombia:
    url: ${API_COLOMBIA_URL:https://api-colombia.com/api/v1/City}
    connect-timeout-ms: ${API_COLOMBIA_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${API_COLOMBIA_READ_TIMEOUT_MS:15000}
    cache-minutes: ${API_COLOMBIA_CACHE_MINUTES:60}
