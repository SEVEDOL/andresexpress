spring:
  application:
    name: orders
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

coverage:
  url: ${COVERAGE_URL:http://localhost:8081}
  timeout-ms: ${COVERAGE_TIMEOUT_MS:3000}