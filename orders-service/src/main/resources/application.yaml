spring:
  application:
    name: orders
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

coverage:
  url: ${COVERAGE_URL:http://localhost:8081}
  # 5 s: si Coverage arranca sin las listas de API Colombia en cache, descargarlas tarda ~3,1 s
  timeout-ms: ${COVERAGE_TIMEOUT_MS:5000}

# Como se publica el evento "pedido creado":
#   sqs  (por defecto) -> cola SQS; Orders no espera el correo (RT-05)
#   http               -> llamada directa a Notifications (sin cola, espera el correo)
events:
  publisher: ${EVENTS_PUBLISHER:sqs}

aws:
  region: ${AWS_REGION:us-east-1}
  sqs:
    # Local: http://localhost:9324 (ElasticMQ en Docker). En AWS se deja vacio.
    endpoint: ${SQS_ENDPOINT:}
    order-created-queue: ${ORDER_CREATED_QUEUE:order-created}
    # Cola que dispara la Lambda de la guia en PDF (RF-07). Va aparte de la de Notifications
    waybill-queue: ${WAYBILL_QUEUE:waybill-requests}
    create-queue: ${SQS_CREATE_QUEUE:true}
  s3:
    # Local: endpoint de un S3 simulado en Docker. En AWS se deja vacio.
    endpoint: ${S3_ENDPOINT:}
    # Bucket privado donde la Lambda guarda las guias; el nombre debe ser unico en todo AWS
    waybill-bucket: ${WAYBILL_BUCKET:guias-envio-andesexpress}
    waybill-prefix: ${WAYBILL_PREFIX:guias/}
    # Minutos que dura la URL de descarga que se le entrega al cliente
    url-minutes: ${WAYBILL_URL_MINUTES:15}

# Solo se usa con events.publisher=http
notifications:
  url: ${NOTIFICATIONS_URL:http://localhost:8083}
  timeout-ms: ${NOTIFICATIONS_TIMEOUT_MS:3000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
