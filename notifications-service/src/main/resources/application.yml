server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: notifications-service
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # Credenciales SOLO por variables de entorno (nunca escritas aqui):
    #   MAIL_USERNAME = correo de Gmail del proyecto
    #   MAIL_PASSWORD = contrasena de aplicacion de Gmail
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    # Local: http://localhost:8000 (DynamoDB Local). En AWS se deja vacio.
    endpoint: ${DYNAMODB_ENDPOINT:}
    create-tables: ${DYNAMODB_CREATE_TABLES:true}
  sqs:
    # Cola donde Orders publica el evento "pedido creado" (RT-05)
    listener-enabled: ${SQS_LISTENER_ENABLED:true}
    # Local: http://localhost:9324 (ElasticMQ en Docker). En AWS se deja vacio.
    endpoint: ${SQS_ENDPOINT:}
    order-created-queue: ${ORDER_CREATED_QUEUE:order-created}
    # Crea la cola y su DLQ (order-created-dlq) si no existen
    create-queue: ${SQS_CREATE_QUEUE:true}
    # Correos que se envian en paralelo
    concurrency: ${SQS_CONCURRENCY:5}

notifications:
  table-name: ${NOTIFICATIONS_TABLE:notifications-log}
