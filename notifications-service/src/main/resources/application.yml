server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: notifications-service
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # Credenciales SOLO por variables de entorno (nunca escritas aqui):
    #   MAIL_USERNAME = correo de Gmail del proyecto
    #   MAIL_PASSWORD = contrasena de aplicacion de Gmail
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    # Local: http://localhost:8000 (DynamoDB Local). En AWS se deja vacio.
    endpoint: ${DYNAMODB_ENDPOINT:}
    create-tables: ${DYNAMODB_CREATE_TABLES:true}

notifications:
  table-name: ${NOTIFICATIONS_TABLE:notifications-log}
